<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}} | Chola Duel</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #08090c;
        background: radial-gradient(circle at center, #181922 0%, #08090c 100%);
        position: fixed;
        top: 0;
        left: 0;
        touch-action: none;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0d0e12;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 10;
        pointer-events: none;
      }
      #unity-logo {
        width: 128px;
        height: 108px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        background-size: contain;
        filter: drop-shadow(0 0 12px rgba(255, 216, 107, 0.35));
      }
      #unity-progress-bar-empty {
        width: 240px;
        height: 14px;
        background: rgba(20, 20, 30, 0.85);
        border: 2px solid #9E5B16;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 16px rgba(0, 0, 0, 0.8), inset 0 0 8px rgba(0, 0, 0, 0.6);
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #9E5B16 0%, #FFD86B 50%, #FFF2D6 100%);
        border-radius: 6px;
        transition: width 0.15s ease-out;
        box-shadow: 0 0 12px rgba(255, 216, 107, 0.6);
      }
      #loading-text {
        color: #FFD86B;
        font-family: 'Cinzel', 'Spectral', serif, sans-serif;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }
      #fullscreen-btn {
        position: fixed;
        bottom: 16px;
        right: 16px;
        width: 42px;
        height: 42px;
        background: rgba(18, 19, 26, 0.75);
        border: 1.5px solid #9E5B16;
        border-radius: 50%;
        cursor: pointer;
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.2s ease;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      #fullscreen-btn:hover {
        background: rgba(35, 38, 52, 0.95);
        border-color: #FFD86B;
        box-shadow: 0 0 14px rgba(255, 216, 107, 0.5);
        transform: scale(1.08);
      }
      #fullscreen-btn svg {
        width: 20px;
        height: 20px;
        fill: #FFD86B;
      }
      #unity-warning {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 25, 0.95);
        border: 1px solid #FFD86B;
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        display: none;
        z-index: 200;
        font-family: sans-serif;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="loading-text">Awakening Dayakattam...</div>
      </div>
      <div id="unity-warning"></div>
      <button id="fullscreen-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenBtn = document.querySelector("#fullscreen-btn");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #7a1c1c; padding: 10px; border-radius: 4px; margin-bottom: 4px;';
        else {
          if (type == 'warning') div.style = 'background: #8a6d1c; padding: 10px; border-radius: 4px; margin-bottom: 4px;';
          setTimeout(function() {
            if (warningBanner.contains(div)) {
              warningBanner.removeChild(div);
              updateBannerVisibility();
            }
          }, 5000);
        }
        updateBannerVisibility();
      }

      function updateCanvasSize() {
        // Full screen responsive sizing across all device types
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener('resize', updateCanvasSize);
      window.addEventListener('orientationchange', function() {
        setTimeout(updateCanvasSize, 100);
      });
      updateCanvasSize();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "flex";

      var unityInstance = null;
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          updateCanvasSize();
        }).catch((message) => {
          alert("Unity Load Error: " + message);
        });
      };

      fullscreenBtn.onclick = () => {
        if (unityInstance) {
          unityInstance.SetFullscreen(1);
        } else if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
